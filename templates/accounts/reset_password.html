{% extends "base.html" %}

{% block title %}
Reset Password
{% endblock %}

{% block content %}
<div class="container-fluid">

    <div class="row justify-content-center">

        <div class="col-lg-6 col-md-8">

            <div class="card shadow">

                <div class="card-header fw-bold">
                    Reset Password
                </div>

                <div class="card-body">

                    {% if form.non_field_errors %}
                    <div class="alert alert-danger">
                        {{ form.non_field_errors }}
                    </div>
                    {% endif %}

                    <form method="post">

                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label fw-bold">Username</label>
                            <input type="text" class="form-control" value="{{ staff.username }}" readonly>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">New Password</label>
                            <div class="input-group">
                                {{ form.password1 }}
                                <button
                                    type="button"
                                    class="btn btn-outline-secondary password-toggle"
                                    data-target="{{ form.password1.id_for_label }}"
                                    aria-label="Show password">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Confirm New Password</label>
                            <div class="input-group">
                                {{ form.password2 }}
                                <button
                                    type="button"
                                    class="btn btn-outline-secondary password-toggle"
                                    data-target="{{ form.password2.id_for_label }}"
                                    aria-label="Show confirm password">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="text-end">
                            <button type="submit" class="btn btn-success">
                                Save Password
                            </button>
                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll(".password-toggle").forEach(function (button) {
        button.addEventListener("click", function () {
            const target = document.getElementById(button.getAttribute("data-target"));

            if (!target) {
                return;
            }

            const isPassword = target.type === "password";
            target.type = isPassword ? "text" : "password";
            button.innerHTML = isPassword ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
        });
    });
});
</script>
{% endblock %}
